<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>YESPS Pro — 全球地震监测与仿真系统</title>

<!-- 引入专业 GIS 引擎 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ═════ 🍏 苹果级专业交互设计系统 ═════ */
:root {
  --bg:         #010204;
  --surface:    rgba(12, 18, 28, 0.75);
  --glass-bd:   rgba(255, 255, 255, 0.1);
  --p-wave:     #00f0ff; /* 纵波蓝 */
  --s-wave:     #ff2a3a; /* 横波红 */
  --accent:     #ff9f0a; /* 强调金 */
  --safe:       #20d060; /* 运行绿 */
  --text-0:     #ffffff;
  --text-1:     rgba(255, 255, 255, 0.7);
  --text-2:     rgba(255, 255, 255, 0.4);
  --font-sys:   -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-num:   "SF Mono", "Consolas", monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { width: 100vw; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text-0); font-family: var(--font-sys); overscroll-behavior: none; }

/* ── 1. 真实地图背景 ── */
#map { position: absolute; inset: 0; z-index: 1; background: #000; }
.leaflet-control-container { display: none; } /* 保持界面纯净 */

/* 地图上的中文标注 HUD */
.map-label {
  background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
  border-left: 3px solid var(--s-wave); border-radius: 4px;
  color: white; padding: 6px 12px; font-size: 13px; font-weight: bold;
  white-space: nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

/* ── 2. 交互 UI 层 ── */
#ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
#ui-layer > * { pointer-events: auto; }

/* 顶栏 */
#nav {
  margin: env(safe-area-inset-top, 15px) 15px 0; padding: 12px 20px;
  background: var(--surface); backdrop-filter: saturate(180%) blur(25px); -webkit-backdrop-filter: blur(25px);
  border: 1px solid var(--glass-bd); border-radius: 18px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.n-title { display: flex; flex-direction: column; }
.n-title h1 { font-size: 18px; font-weight: 900; letter-spacing: 0.5px; }
.n-title span { font-size: 9px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }
.n-status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--safe); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--safe); box-shadow: 0 0 10px var(--safe); animation: pulse 2s infinite; }

/* 悬浮面板 */
#widgets { display: flex; flex-direction: column; gap: 10px; padding: 15px; opacity: 0; transition: 0.5s; }
#widgets.show { opacity: 1; }
.w-row { display: flex; gap: 10px; }
.widget {
  flex: 1; background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-bd); border-radius: 16px; padding: 14px;
}
.w-ttl { font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; display: flex; justify-content: space-between; }
.w-val { font-family: var(--font-num); font-size: 32px; font-weight: 300; font-variant-numeric: tabular-nums; color: var(--text-0); line-height: 1; }
.w-val.p { color: var(--p-wave); } .w-val.s { color: var(--s-wave); }
.w-unit { font-size: 11px; color: var(--text-2); margin-left: 4px; }

/* 烈度仪表 */
.mmi-box { margin-top: 8px; }
.mmi-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.mmi-bar-fill { height: 100%; width: 0%; background: var(--s-wave); transition: width 0.3s; }

/* ── 3. 底部数据抽屉 ── */
#sheet {
  position: absolute; left: 0; right: 0; height: 85dvh; bottom: -85dvh;
  background: rgba(10, 14, 20, 0.9); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
  border-top: 1px solid var(--glass-bd); border-radius: 30px 30px 0 0;
  display: flex; flex-direction: column; box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
}
#sheet.half { transform: translateY(calc(100% - 420px - env(safe-area-inset-bottom, 20px))); }
#sheet.mini { transform: translateY(calc(100% - 75px - env(safe-area-inset-bottom, 20px))); }

.handle { padding: 12px 0 10px; display: flex; justify-content: center; cursor: grab; }
.pill { width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25); }

.s-content { flex: 1; padding: 0 16px 20px; overflow-y: auto; display: flex; flex-direction: column; }
.s-content::-webkit-scrollbar { display: none; }

.s-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.s-ttl { font-size: 18px; font-weight: 800; }

/* 排序按钮 */
.sort-box { display: flex; gap: 8px; margin-bottom: 12px; }
.btn-sort {
  background: rgba(255,255,255,0.08); border: 1px solid var(--glass-bd); color: var(--text-1);
  padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
}
.btn-sort.active { background: var(--p-wave); color: #000; border-color: var(--p-wave); }

/* 列表卡片 */
.list { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.02);
  border-radius: 16px; padding: 15px; display: flex; align-items: center; gap: 16px; cursor: pointer;
}
.card.active { border-color: var(--p-wave); background: rgba(0, 240, 255, 0.08); }
.c-mag { font-family: var(--font-num); font-size: 32px; font-weight: 700; width: 60px; text-align: center; }
.m-hg { color: var(--s-wave); text-shadow: 0 0 15px rgba(255,42,58,0.4); } 
.m-md { color: var(--accent); } 
.m-lw { color: var(--text-1); }

.c-info { flex: 1; min-width: 0; }
.c-info h4 { font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;}
.c-info p { font-size: 11px; color: var(--text-2); font-family: var(--font-num); }

/* 实时日志 */
#logs { margin-top: 15px; background: rgba(0,0,0,0.3); border-radius: 14px; padding: 12px; font-family: var(--font-num); font-size: 12px; color: var(--text-2); max-height: 120px; overflow-y: auto; display: none; }
.log-line { display: flex; gap: 10px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.log-t { color: var(--text-2); min-width: 50px; } .log-m.info { color: var(--p-wave); } .log-m.alert { color: var(--s-wave); font-weight: bold; }

@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* 平板/桌面版 宽屏适配 */
@media (min-width: 768px) {
  #nav { position: absolute; top: 15px; left: 375px; right: 15px; margin: 0; }
  #widgets { position: absolute; top: 85px; right: 20px; width: 360px; padding: 0; }
  #sheet { position: absolute; top: 0; bottom: 0; left: 0; width: 360px; border-radius: 0; transform: translateY(0) !important; height: 100dvh; }
  .handle { display: none; }
  .s-content { padding-top: 30px; }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="ui-layer">
  <div id="nav">
    <div class="n-title">
      <h1>YESPS<span>Pro</span></h1>
      <span>全球地震实时监测与仿真引擎</span>
    </div>
    <div class="n-status"><div class="dot" id="sys-dot"></div> <span id="sys-txt">系统启动中...</span></div>
  </div>

  <div id="widgets">
    <div class="widget">
      <div class="w-ttl">仿真时间轴 (x60) <span id="t-utc" style="font-family:var(--font-num); color:var(--safe)">--:--:--</span></div>
      <div class="w-val" id="w-timer">00.00 <span class="w-unit">秒</span></div>
      <div style="margin-top:8px; font-size:11px; color:var(--text-2)">
        震中准确时间: <b id="t-occ" style="color:var(--text-0)">--:--:--</b>
      </div>
    </div>

    <div class="w-row">
      <div class="widget">
        <div class="w-ttl" style="color:var(--p-wave)">纵波半径 (预警)</div>
        <div class="w-val p" id="w-p">—</div>
        <span class="w-unit">公里 (km)</span>
      </div>
      <div class="widget">
        <div class="w-ttl" style="color:var(--s-wave)">横波半径 (破坏)</div>
        <div class="w-val s" id="w-s">—</div>
        <span class="w-unit">公里 (km)</span>
      </div>
    </div>

    <div class="widget">
      <div class="w-ttl">地表烈度衰减 (MMI 等级)</div>
      <div class="w-val" id="w-mmi">Level --</div>
      <div class="mmi-box">
        <div class="mmi-bar-bg"><div class="mmi-bar-fill" id="mmi-bar"></div></div>
      </div>
    </div>
  </div>

  <div id="sheet" class="half">
    <div class="handle" onclick="toggleSheet()"><div class="pill"></div></div>
    <div class="s-content">
      <div class="s-hdr">全球地震数据库 <span id="data-count">加载中...</span></div>
      
      <div class="sort-box">
        <div class="btn-sort active" id="sort-mag" onclick="setSort('mag')">按烈度排序</div>
        <div class="btn-sort" id="sort-time" onclick="setSort('time')">按时间排序</div>
      </div>

      <div class="list" id="eq-list"></div>
      <div id="logs"></div>
    </div>
  </div>
</div>

<script>
/* ═════ 1. 专业数据库 (20场历史巨灾 + 实时接口) ═════ */
const HISTORICAL_MEGA = [
  { mag:9.5, place:"智利瓦尔迪维亚 (有记录史最高)", lat:-38.14, lon:-73.03, dep:33, time:new Date("1960-05-22T19:11:14Z") },
  { mag:9.1, place:"日本东海大地震 (2011 东北大震)", lat:38.297, lon:142.373, dep:29, time:new Date("2011-03-11T05:46:24Z") },
  { mag:9.1, place:"印度洋苏门答腊 (2004 节后海啸)", lat:3.295, lon:95.982, dep:30, time:new Date("2004-12-26T00:58:53Z") },
  { mag:8.0, place:"中国汶川大地震 (2008 龙门山破裂)", lat:31.021, lon:103.367, dep:19, time:new Date("2008-05-12T06:28:01Z") },
  { mag:7.8, place:"中国唐山大地震 (1976 世纪灾难)", lat:39.570, lon:118.180, dep:12, time:new Date("1976-07-27T19:42:53Z") },
  { mag:7.8, place:"土耳其加济安泰普 (2023 双震型)", lat:37.174, lon:37.032, dep:18, time:new Date("2023-02-06T01:17:35Z") }
];

let globalData = [];
let sortType = 'mag'; // 'mag' or 'time'

/* ═════ 2. GIS 引擎与实时同步渲染 ═════ */
const map = L.map('map', { center: [25, 110], zoom: 4, zoomControl: false, attributionControl: false, worldCopyJump: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 12 }).addTo(map);

// 震中标签
const mapLabel = L.marker([0, 0], {
  icon: L.divIcon({ className: 'map-label', html: '锁定中...', iconAnchor: [-15, 25] })
});

// 地震波对象 (Leaflet 原生圆，防穿帮)
const pWaveCircle = L.circle([0,0], { radius: 0, color: 'var(--p-wave)', weight: 2, dashArray: '8, 8', fill: false, interactive: false });
const sWaveCircle = L.circle([0,0], { radius: 0, color: 'var(--s-wave)', weight: 3, fillColor: 'var(--s-wave)', fillOpacity: 0.1, interactive: false });

async function initSystem() {
  try {
    const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson');
    const data = await res.json();
    const live = data.features.map(f => ({
      mag: f.properties.mag,
      place: f.properties.place.replace(/ of /g, ' · '),
      time: new Date(f.properties.time),
      lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], dep: f.geometry.coordinates[2]
    }));
    // 合并数据
    globalData = [...live, ...HISTORICAL_MEGA];
    document.getElementById('sys-dot').style.background = 'var(--safe)';
    document.getElementById('sys-txt').textContent = '实时卫星数据已同步';
  } catch (e) {
    globalData = HISTORICAL_MEGA;
    document.getElementById('sys-dot').style.background = 'var(--accent)';
    document.getElementById('sys-txt').textContent = '离线/权威库模式';
  }
  refreshList();
}

function setSort(type) {
  sortType = type;
  document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-' + type).classList.add('active');
  refreshList();
}

function refreshList() {
  const list = document.getElementById('eq-list'); list.innerHTML = '';
  const sorted = [...globalData].sort((a,b) => sortType === 'mag' ? b.mag - a.mag : b.time - a.time);
  
  document.getElementById('data-count').textContent = `${sorted.length} 条记录`;
  
  sorted.forEach(q => {
    const d = document.createElement('div'); d.className = 'card';
    const c = q.mag >= 8 ? 'm-hg' : q.mag >= 7 ? 'm-md' : 'm-lw';
    d.innerHTML = `
      <div class="c-mag ${c}">${q.mag.toFixed(1)}</div>
      <div class="c-info">
        <h4>${q.place}</h4>
        <p>震源深度: ${q.dep.toFixed(0)}km | 时间: ${q.time.toLocaleDateString()}</p>
      </div>`;
    d.onclick = () => startSim(q, d);
    list.appendChild(d);
  });
}

/* ═════ 3. 物理仿真核心 (1秒真实=60秒模拟) ═════ */
let aq = null, isRunning = false, simT = 0, lastSysT = 0, physics = {}, trig = {};

function startSim(q, el) {
  // UI 初始化
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active')); el.classList.add('active');
  if (window.innerWidth < 768) document.getElementById('sheet').className = 'mini';
  document.getElementById('widgets').classList.add('show');
  
  // 地图定位与标注
  map.flyTo([q.lat, q.lon], 5);
  mapLabel.setLatLng([q.lat, q.lon]).addTo(map);
  mapLabel.getElement().innerHTML = `<b>震中: ${q.place.split(' · ').pop()}</b><br>坐标: ${q.lat.toFixed(2)}, ${q.lon.toFixed(2)}`;
  
  // 物理波速 (根据深度动态模拟)
  const pVel = 6.0 + (q.dep / 100); 
  physics = { p: pVel, s: pVel / 1.73, mmi: Math.min(10, (q.mag * 1.5) - (q.dep * 0.05)) };
  
  // 状态复位
  aq = q; isRunning = true; simT = 0; lastSysT = Date.now(); trig = {};
  
  // 初始化波形
  pWaveCircle.setLatLng([q.lat, q.lon]).setRadius(0).addTo(map);
  sWaveCircle.setLatLng([q.lat, q.lon]).setRadius(0).addTo(map);
  
  document.getElementById('t-occ').textContent = q.time.toLocaleTimeString();
  document.getElementById('logs').innerHTML = '';
  document.getElementById('logs').style.display = 'block';
  log('info', `测控锁定: ${q.place} | 正在解算地幔波速...`);
}

function log(t, m) {
  const box = document.getElementById('logs');
  box.insertAdjacentHTML('afterbegin', `<div class="log-line"><span class="log-t">[T+${simT.toFixed(1)}s]</span><span class="log-m ${t}">${m}</span></div>`);
}

function render() {
  if (aq && isRunning) {
    const now = Date.now();
    const dt = (now - lastSysT) / 1000; lastSysT = now;
    simT += dt * 60; // 时间加速
    
    // 更新 UI
    document.getElementById('w-timer').textContent = simT.toFixed(2);
    const simUtc = new Date(aq.time.getTime() + simT * 1000);
    document.getElementById('t-utc').textContent = simUtc.toLocaleTimeString();

    // 1. 纵波 P (Radius in Meters)
    const pKm = simT * physics.p;
    pWaveCircle.setRadius(pKm * 1000);
    document.getElementById('w-p').textContent = pKm.toFixed(0);

    // 2. 横波 S
    const sDelay = aq.dep / physics.s;
    if (simT > sDelay) {
      const sKm = (simT - sDelay) * physics.s;
      sWaveCircle.setRadius(sKm * 1000);
      document.getElementById('w-s').textContent = sKm.toFixed(0);
      
      // 烈度衰减
      const currentMMI = Math.max(1, physics.mmi - 3 * Math.log10(sKm / 20 + 1));
      const mmiRatio = currentMMI / 10;
      const roman = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
      document.getElementById('w-mmi').textContent = `等级 ${roman[Math.floor(currentMMI)-1] || 'I'}`;
      document.getElementById('mmi-bar').style.width = (mmiRatio * 100) + '%';
      
      // 警报
      if (!trig.s) { trig.s=1; log('alert', `⚠ 破坏性横波抵达地表！震中区域烈度最高。`); }
    }

    if (simT > aq.mag * 50) { isRunning = false; log('info', `能量衰减完毕，波动平息。`); }
  }
  requestAnimationFrame(render);
}

// 抽屉交互
function toggleSheet() {
  if (window.innerWidth >= 768) return;
  const s = document.getElementById('sheet');
  s.className = s.className === 'mini' ? 'half' : 'mini';
}

initSystem();
render();

</script>
</body>
</html>
